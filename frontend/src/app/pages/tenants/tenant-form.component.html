<div class="page-header">
  <h1 class="page-title">{{ tenantId() ? 'Edit Tenant' : 'New Tenant' }}</h1>
  <a routerLink="/tenants" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<app-alert-banner [message]="error()" type="error" (dismissed)="error.set(null)" />

<div class="card p-4">
  @if (loading()) {
    <div class="text-center py-4 text-muted small">Loading...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-medium">Tenant Code *</label>
          <input type="text" class="form-control" formControlName="tenantCode" placeholder="TNT-004" />
          <app-field-error [control]="form.controls.tenantCode" label="Tenant Code" />
        </div>

        <div class="col-md-8">
          <label class="form-label fw-medium">Full Name *</label>
          <input type="text" class="form-control" formControlName="fullName" placeholder="Emily Carter" />
          <app-field-error [control]="form.controls.fullName" label="Full Name" />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-medium">Phone *</label>
          <input type="text" class="form-control" formControlName="phone" placeholder="5551234567" />
          <app-field-error
            [control]="form.controls.phone"
            label="Phone"
            patternMessage="Enter 7 to 20 digits."
          />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-medium">Email *</label>
          <input type="email" class="form-control" formControlName="email" placeholder="tenant@mail.local" />
          <app-field-error [control]="form.controls.email" label="Email" />
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">Address</label>
          <input type="text" class="form-control" formControlName="currentAddress" placeholder="112 Pine Road, Austin" />
          <app-field-error [control]="form.controls.currentAddress" label="Address" />
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a routerLink="/tenants" class="btn btn-outline-secondary btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  }
</div>

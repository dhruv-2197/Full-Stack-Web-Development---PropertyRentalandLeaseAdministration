<div class="page-header">
  <h1 class="page-title">{{ propertyId() ? 'Edit Property' : 'New Property' }}</h1>
  <a routerLink="/properties" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<app-alert-banner [message]="error()" type="error" (dismissed)="error.set(null)" />

<div class="card p-4">
  @if (loading()) {
    <div class="text-center py-4 text-muted small">Loading...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-medium">Property Code *</label>
          <input type="text" class="form-control" formControlName="propertyCode" placeholder="PRP-103" />
          <app-field-error [control]="form.controls.propertyCode" label="Property Code" />
        </div>

        <div class="col-md-8">
          <label class="form-label fw-medium">Property Name *</label>
          <input type="text" class="form-control" formControlName="propertyName" placeholder="Oakwood Apartments" />
          <app-field-error [control]="form.controls.propertyName" label="Property Name" />
        </div>

        <div class="col-md-4">
          <label class="form-label fw-medium">Type *</label>
          <select class="form-select" formControlName="propertyType">
            <option value="Residential">Residential</option>
            <option value="Commercial">Commercial</option>
            <option value="Mixed-Use">Mixed-Use</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-medium">City *</label>
          <input type="text" class="form-control" formControlName="city" placeholder="Austin" />
          <app-field-error [control]="form.controls.city" label="City" />
        </div>

        <div class="col-md-4">
          <label class="form-label fw-medium">Manager *</label>
          <input type="text" class="form-control" formControlName="managerName" placeholder="John Miller" />
          <app-field-error [control]="form.controls.managerName" label="Manager" />
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">Address *</label>
          <input type="text" class="form-control" formControlName="address" placeholder="420 Oakwood Ave" />
          <app-field-error [control]="form.controls.address" label="Address" />
        </div>

        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="propActive" formControlName="active" />
            <label class="form-check-label small" for="propActive">Active</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a routerLink="/properties" class="btn btn-outline-secondary btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  }
</div>
